[project]
name = "vetsys-backend"
version = "0.1.0"
description = "Fundação do Sistema Veterinário"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.15,<2",
    "fastapi>=0.115,<1",
    "httpx>=0.27,<1",
    "phonenumbers>=9.0.42",
    "psycopg[binary]>=3.2,<4",
    "pydantic>=2,<3",
    "python-multipart==0.0.32",
    "reportlab==5.1.0",
    "sqlalchemy>=2.0,<3",
    "uvicorn>=0.30,<1",
]

[dependency-groups]
dev = [
    "httpx>=0.27,<1",
    "pytest>=8,<10",
    "ruff>=0.11,<1",
    "mypy>=1.15,<2",
    "pypdf>=7.0.1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["app", "tests", "migrations"]
